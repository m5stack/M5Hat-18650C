name=M5Hat-18650C
version=0.1.0
author=M5Stack Technology CO LTD
maintainer=M5Stack <support@m5stack.com>
sentence=Arduino library for M5Stack 18650C Battery Hat — I2C battery monitoring via INA226 (voltage/current/power) and AW32257FCR charger.
paragraph=Drives the two I2C chips on the HAT 18650C V1.1: TI INA226 16-bit voltage/current/power monitor (0x41, 10mR shunt) and AW32257FCR Li-Ion switch-mode charger (0x6A). Provides bus voltage, charge/discharge current, power, SOC, charge state (Ready/Charging/Done/Fault), and configurable charge parameters.
category=Device Control
